name: TEMP list Bedrock inference profiles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-list-inference-profiles.yml']
permissions:
  id-token: write
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::271378210266:role/github-actions-deploy
          aws-region: us-east-1
      - name: Anthropic inference profiles (us-east-1)
        run: |
          aws bedrock list-inference-profiles --region us-east-1 --max-results 1000 \
            --query "inferenceProfileSummaries[?contains(inferenceProfileId, 'anthropic')].[inferenceProfileId,status,type]" \
            --output text | sort
      - name: Underlying models of Sonnet profiles
        run: |
          for id in $(aws bedrock list-inference-profiles --region us-east-1 --max-results 1000 \
              --query "inferenceProfileSummaries[?contains(inferenceProfileId, 'sonnet')].inferenceProfileId" --output text); do
            echo "== $id"
            aws bedrock get-inference-profile --region us-east-1 --inference-profile-identifier "$id" \
              --query "models[].modelArn" --output text | tr '\t' '\n'
          done
      - name: Lambda execution role and its policies
        run: |
          ROLE_ARN=$(aws lambda get-function-configuration --function-name pipeline-agent --query Role --output text) || true
          echo "Role: $ROLE_ARN"
          ROLE=${ROLE_ARN##*/}
          aws iam list-attached-role-policies --role-name "$ROLE" --output text || true
          for p in $(aws iam list-role-policies --role-name "$ROLE" --query PolicyNames --output text 2>/dev/null); do
            echo "== inline $p"
            aws iam get-role-policy --role-name "$ROLE" --policy-name "$p" --query PolicyDocument --output json || true
          done
