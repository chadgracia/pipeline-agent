name: Deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::271378210266:role/github-actions-deploy
          aws-region: us-east-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --no-deps --target build pypdf==6.21.2
          cp lambda_function.py names.csv build/
          (cd build && zip -qr ../function.zip . -x '*/__pycache__/*' '*.pyc')
          aws lambda update-function-code --function-name pipeline-agent --zip-file fileb://function.zip
