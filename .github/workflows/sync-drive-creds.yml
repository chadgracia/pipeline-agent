name: Sync Google Drive OAuth creds to S3
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Upload google-drive-oauth.json
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for v in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            if [ -z "${!v}" ]; then echo "Missing secret $v"; exit 1; fi
          done
          jq -n \
            --arg client_id "$GOOGLE_CLIENT_ID" \
            --arg client_secret "$GOOGLE_CLIENT_SECRET" \
            --arg refresh_token "$GOOGLE_REFRESH_TOKEN" \
            '{client_id: $client_id, client_secret: $client_secret, refresh_token: $refresh_token}' \
          | aws s3 cp - s3://pipeline-token/google-drive-oauth.json --content-type application/json --only-show-errors
          echo "Uploaded s3://pipeline-token/google-drive-oauth.json"
